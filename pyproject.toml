[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micnn"
version = "1.0.0"
description = "MI-CNN: Mamba-Inspired CNN for postural state classification in immersive VR"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Nipa Anjum" },
    { name = "Md Irfan Pavel" },
    { name = "Robert Gonzalez Jr" },
    { name = "Kevin Desai" },
    { name = "Alberto Cordova" },
    { name = "M. Rasel Mahmud" },
    { name = "John Quarles" },
]
keywords = [
    "virtual reality",
    "postural stability",
    "time series classification",
    "multimodal sensing",
    "deep learning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tensorflow>=2.12",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]

[tool.setuptools]
packages = ["micnn"]
